<!DOCTYPE html>

            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(214, 201, 182, .76);
            border-radius: 30px;
            background: rgba(255, 254, 249, .68);

        }

        }

        .setting-item.similar-highlight {

            border-color: rgba(79, 117, 144, .36);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }

        button {
            min-height: 36px;
            padding: 7px 15px;
            border: none;
            border-radius: 999px;
            font-size: 14px;
            cursor: pointer;
            transition: transform .28s ease, background .28s ease, box-shadow .28s ease, color .28s ease, border-color .28s ease;
            font-weight: 700;
        }

        button:hover {

        button:active {

        .btn-primary {

        }

        .content-area {

            padding: 28px 34px 30px;
            background:
                radial-gradient(circle at 4% 18%, rgba(181, 154, 98, .08), transparent 18rem),
                radial-gradient(circle at 100% 78%, rgba(82, 107, 75, .08), transparent 24rem);
        }

        .category-header {
            font-family: "方正屏显雅宋简体", "FZPingXianYaSongS-R-GB", "FZPingXianYaSongS-R-GBK", "FZPingXianYaSongS-R", "方正屏显雅宋_GBK", "方正屏显雅宋_GB2312", "Source Han Serif SC", "思源宋体", "Noto Serif SC", "Microsoft YaHei", "微软雅黑", serif;
            font-size: 31px;

            font-weight: 700;
            letter-spacing: .045em;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .setting-item {
            background: linear-gradient(135deg, rgba(255, 254, 249, .95), rgba(249, 247, 239, .9));
            backdrop-filter: blur(14px);
            padding: 18px 20px 16px;
            border-radius: 26px 34px 24px 30px;
            border: 1px solid rgba(214, 201, 182, .78);
            cursor: move;
            transition: transform .32s ease, box-shadow .32s ease, border-color .32s ease, background .32s ease;

            display: grid;
            grid-template-columns: 46px minmax(0, 1fr);
            column-gap: 12px;
            row-gap: 12px;
            align-items: start;

        .setting-item:nth-child(3n + 1) {

        }

        .setting-item:nth-child(3n + 2) {

        }

        .setting-item.dragging {

        }

        .setting-item.drag-over {

        .setting-number {

        .btn-edit, .btn-delete, .btn-save, .btn-cancel {

            padding: 7px 15px;
            font-size: 13px;
        }

        .btn-edit {

        }

        .btn-edit:hover {

                        </div>
                    </div>
                    <div class="duplicate-notice" id="duplicateNotice" aria-live="polite">
                        <span class="duplicate-notice-text">已有相同条目</span>
                        <span class="duplicate-notice-actions">
                            <button class="btn-quiet" type="button" onclick="jumpToSimilarSetting()">查看</button>
                            <button class="btn-quiet" type="button" onclick="addSetting(true)">仍然添加</button>
                        </span>
                    </div>
                </div>
            </section>

            <button class="library-toggle" id="libraryToggle" onclick="toggleLibrary()" aria-expanded="false">
                <span class="library-toggle-title" id="categoryHeader">全部设定</span>
                <span class="library-toggle-count" id="totalCount">共 0 条设定</span>
            </button>

            <section class="library-panel" id="libraryPanel" aria-hidden="true">
                <aside class="sidebar" aria-label="设定分类">
                    <h2>分类</h2>
                    <ul class="category-list" id="categoryList">
                        <li class="category-item active" data-category="all">
                            <span>全部设定</span>
                            <span class="category-count" id="count-all">0</span>
                        </li>
                    </ul>
                    <button class="add-category-btn" onclick="showAddCategoryModal()">+ 新建分类</button>
                </aside>

                <div class="library-main">
                    <div class="library-tools">
                        <input type="text" class="search-box" id="searchBox" placeholder="搜索设定内容..." aria-label="搜索设定内容">
                        <div class="library-actions">
                            <button class="btn-secondary organize-entry-btn" id="organizeEntryBtn" onclick="enterOrganizeMode()">整理</button>
                            <button class="btn-secondary" onclick="showExportModal()">导出</button>
                            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">导入</button>
                        </div>
                        <div class="batch-toolbar" id="batchToolbar" aria-live="polite"></div>
                        <input type="file" id="importFile" accept=".txt,.json" onchange="importSettings(event)">
                    </div>

                    <section class="content-area" id="contentArea">
                        <div class="settings-list" id="settingsList">
                            <div class="empty-state">暂无设定，开始添加吧</div>
                        </div>
                    </section>

                    <footer class="footer">
                        <div class="last-modified" id="lastModified">从未修改</div>
                    </footer>
                </div>
            </section>
        </main>
    </div>

    <div class="modal" id="addCategoryModal" role="dialog" aria-modal="true" aria-labelledby="addCategoryTitle">
        <div class="modal-content">
            <h3 class="modal-title" id="addCategoryTitle">新建分类</h3>
            <input type="text" class="modal-input" id="categoryNameInput" placeholder="输入分类名称...">
            <div class="modal-buttons">
                <button class="btn-primary" onclick="addCategory()">创建</button>
                <button class="btn-cancel" onclick="closeModal('addCategoryModal')">取消</button>
            </div>
        </div>
    </div>

    <div class="modal" id="manageCategoryModal" role="dialog" aria-modal="true" aria-labelledby="manageCategoryTitle">
        <div class="modal-content">
            <h3 class="modal-title" id="manageCategoryTitle">管理分类</h3>
            <input type="text" class="modal-input" id="manageCategoryNameInput" placeholder="输入分类名称...">
            <div class="category-modal-actions">
                <div class="modal-buttons manage-category-buttons">
                    <button class="btn-save" onclick="renameCategory()">保存</button>
                    <button class="btn-delete" id="deleteCategoryBtn" onclick="deleteCategory()">删除</button>
                    <button class="btn-cancel" onclick="closeModal('manageCategoryModal')">取消</button>
                </div>
            </div>
            <p class="category-delete-note" id="deleteCategoryNote"></p>
        </div>
    </div>


    <div class="modal" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
        <div class="modal-content">
            <h3 class="modal-title" id="exportTitle">导出设定</h3>
            <div class="export-options">
                <div class="export-option" onclick="exportPlainText()" tabindex="0" role="button">
                    <div class="export-option-title">纯文字导出</div>
                    <div class="export-option-desc">每条设定以空行分隔，适合整理为干净文本</div>
                </div>
                <div class="export-option" onclick="exportWithCategories()" tabindex="0" role="button">
                    <div class="export-option-title">带分类导出</div>
                    <div class="export-option-desc">保留分类、顺序和修改记录，适合完整备份</div>
                </div>
            </div>
            <div class="modal-buttons" style="margin-top: 16px;">
                <button class="btn-cancel" style="width: 100%;" onclick="closeModal('exportModal')">取消</button>
            </div>
        </div>
    </div>

    <script>
        let settings = [];
        let categories = ['未分类'];
        let currentCategory = 'all';
        let lastModified = null;
        let draggedItem = null;
        let draggedCategory = null;
        let managingCategory = null;
        let dragMode = null;
        let similarCandidateId = null;
        let similarCandidateContent = '';
        let organizeMode = false;
        let batchSelectedIds = new Set();
        
        // 生成内容哈希（简单版本）
        function generateHash(text) {
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                const char = text.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36);
        }
        
        // 计算所有设定的内容哈希
        function calculateContentHash() {
            const content = settings.map(s => s.content).join('|');
            return generateHash(content);
        }
        
        // 更新最后修改时间
        function updateLastModified() {
            const hash = calculateContentHash();
            const now = new Date();
            lastModified = {
                time: now.toLocaleString('zh-CN'),
                hash: hash
            };
            saveSettings();
            updateFooter();
        }
        
        // 加载设定
        function loadSettings() {
            const saved = localStorage.getItem('silvanSettings');
            if (saved) {
                const data = JSON.parse(saved);
                settings = data.settings || [];
                categories = data.categories || ['未分类'];
                lastModified = data.lastModified || null;
            }
            renderCategories();
            renderSettings();
            updateFooter();
        }
        
        // 保存设定
        function saveSettings() {
            const data = {
                settings: settings,
                categories: categories,
                lastModified: lastModified
            };
            localStorage.setItem('silvanSettings', JSON.stringify(data));
        }
        
        // 更新抽屉计数
        function updateLibraryCount(count) {
            const countEl = document.getElementById('totalCount');
            if (!countEl) return;

            let displayCount = count;
            if (typeof displayCount !== 'number') {
                displayCount = currentCategory === 'all'
                    ? settings.length
                    : settings.filter(s => s.category === currentCategory).length;
            }

            countEl.textContent = `共 ${displayCount} 条设定`;
        }

        function getDefaultCategory() {
            return categories[0] || '未分类';
        }

        function isUncategorizedView() {
            return currentCategory === getDefaultCategory();
        }

        function exitOrganizeMode() {
            organizeMode = false;
            batchSelectedIds.clear();
            renderSettings();
        }

        function enterOrganizeMode() {
            if (!isUncategorizedView()) return;
            organizeMode = true;
            batchSelectedIds.clear();
            renderSettings();
        }

        function toggleBatchSelection(event, id) {
            event.stopPropagation();
            if (!organizeMode) return;
            if (batchSelectedIds.has(id)) {
                batchSelectedIds.delete(id);
            } else {
                batchSelectedIds.add(id);
            }
            renderSettings();
        }

        function moveSelectedToCategory(category) {
            if (!organizeMode || batchSelectedIds.size === 0) return;
            settings.forEach(setting => {
                if (batchSelectedIds.has(setting.id)) {
                    setting.category = category;
                }
            });
            organizeMode = false;
            batchSelectedIds.clear();
            updateLastModified();
            renderCategories();
            renderSettings();
        }

        function renderBatchToolbar(visibleCount) {
            const entryBtn = document.getElementById('organizeEntryBtn');
            const toolbar = document.getElementById('batchToolbar');
            if (!entryBtn || !toolbar) return;

            const canOrganize = isUncategorizedView() && visibleCount > 0;
            entryBtn.style.display = canOrganize && !organizeMode ? 'inline-flex' : 'none';

            if (!organizeMode || !isUncategorizedView()) {
                toolbar.classList.remove('active');
                toolbar.innerHTML = '';
                return;
            }

            const targets = categories.filter(cat => cat !== getDefaultCategory());
            const targetHtml = targets.length
                ? `<span class="batch-move-label">移动到</span><div class="batch-category-strip">${targets.map(cat => `<button type="button" class="batch-category-btn" onclick="moveSelectedToCategory('${escapeJs(cat)}')">${escapeHtml(cat)}</button>`).join('')}</div>`
                : '<span class="batch-empty-target">暂无可移动分类</span>';

            toolbar.classList.add('active');
            toolbar.innerHTML = `
                <span class="batch-status">已选 ${batchSelectedIds.size} 条</span>
                ${targetHtml}
                <button type="button" class="batch-cancel-btn" onclick="exitOrganizeMode()">退出</button>
            `;
        }

        // 渲染分类列表
        function renderCategories() {
            const list = document.getElementById('categoryList');
            const allCount = settings.length;

            let html = `
                <li class="category-item ${currentCategory === 'all' ? 'active' : ''}" data-category="all" onclick="switchCategory('all')">
                    <span class="category-main">全部设定</span>
                    <span class="category-meta">
                        <span class="category-count">${allCount}</span>
                    </span>
                </li>
            `;

            categories.forEach(cat => {
                const count = settings.filter(s => s.category === cat).length;
                const canManage = cat !== getDefaultCategory();
                html += `
                    <li class="category-item ${currentCategory === cat ? 'active' : ''}" data-category="${escapeHtml(cat)}" draggable="true" onclick="switchCategory('${escapeJs(cat)}')" ondragstart="handleCategorySortStart(event, '${escapeJs(cat)}')" ondragover="handleCategoryDragOver(event)" ondragenter="handleCategoryDragEnter(event)" ondragleave="handleCategoryDragLeave(event)" ondrop="handleCategoryDrop(event, '${escapeJs(cat)}')" ondragend="handleCategorySortEnd(event)">
                        <span class="category-main">${escapeHtml(cat)}</span>
                        <span class="category-meta">
                            <span class="category-count">${count}</span>
                            ${canManage ? `<button type="button" class="category-manage-btn" aria-label="管理分类" onclick="showManageCategoryModal(event, '${escapeJs(cat)}')" onmousedown="event.stopPropagation()" draggable="false">⋯</button>` : ''}
                        </span>
                    </li>
                `;
            });

            list.innerHTML = html;
            updateLibraryCount();
        }

        // 切换分类
        function switchCategory(category) {
            currentCategory = category;
            if (!isUncategorizedView()) {
                organizeMode = false;
                batchSelectedIds.clear();
            }
            renderCategories();
            renderSettings();
        }
        
        function normalizeForDuplicate(text) {
            return (text || '')
                .trim()
                .replace(/　/g, ' ')
                .replace(/\s+/g, ' ')
                .toLowerCase();
        }

        function findDuplicateSetting(content) {
            const normalized = normalizeForDuplicate(content);
            if (!normalized) return null;
            return settings.find(setting => normalizeForDuplicate(setting.content) === normalized) || null;
        }

        function showDuplicateNotice(setting) {
            similarCandidateId = setting.id;
            similarCandidateContent = setting.content;

            const notice = document.getElementById('duplicateNotice');
            if (notice) notice.classList.add('active');

            jumpToSimilarSetting();
        }

        function clearDuplicateNotice() {
            similarCandidateId = null;
            similarCandidateContent = '';

            const notice = document.getElementById('duplicateNotice');
            if (notice) notice.classList.remove('active');

            document.querySelectorAll('.setting-item.similar-highlight').forEach(item => {
                item.classList.remove('similar-highlight');
            });
        }

        function jumpToSimilarSetting() {
            if (!similarCandidateId) return;

            libraryExpanded = true;
            currentCategory = 'all';
            updateLibraryState();
            renderCategories();
            renderSettings();

            setTimeout(() => {
                const item = document.getElementById(`item-${similarCandidateId}`);
                if (!item) return;
                item.classList.add('similar-highlight');
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 80);
        }

        // 添加设定
        function addSetting(forceAdd = false) {
            const input = document.getElementById('newSetting');
            const content = input.value.trim();
            
            if (!content) {
                alert('请输入内容');
                return;
            }

            if (!forceAdd) {
                const duplicate = findDuplicateSetting(content);
                if (duplicate) {
                    showDuplicateNotice(duplicate);
                    return;
                }
            }
            
            const category = currentCategory === 'all' ? categories[0] : currentCategory;
            
            settings.push({
                id: Date.now(),
                content: content,
                category: category,
                created: new Date().toLocaleString('zh-CN')
            });
            
            input.value = '';
            input.style.height = '44px';
            clearDuplicateNotice();
            updateLastModified();
            renderCategories();
            renderSettings();
            
            // 滚动到底部
            setTimeout(() => {
                const contentArea = document.getElementById('contentArea');
                if (contentArea) contentArea.scrollTop = contentArea.scrollHeight;
            }, 100);
        }
        
        function renderCategoryOptions(selectedCategory) {
            return categories.map(cat => `
                <option value="${escapeHtml(cat)}" ${cat === selectedCategory ? 'selected' : ''}>${escapeHtml(cat)}</option>
            `).join('');
        }

        function renderCategoryPicker(setting) {
            const options = categories.map(cat => `
                <button type="button" class="edit-category-option ${cat === setting.category ? 'active' : ''}" onclick="selectEditCategory(event, ${setting.id}, '${escapeJs(cat)}')">${escapeHtml(cat)}</button>
            `).join('');
            return `
                <div class="edit-category-picker" id="category-picker-${setting.id}" data-selected="${escapeHtml(setting.category)}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">
                    <button type="button" class="edit-category-trigger" onclick="toggleCategoryPicker(event, ${setting.id})"><span class="edit-category-trigger-label">${escapeHtml(setting.category)}</span><span class="edit-category-trigger-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 7.5l5 5 5-5"></path></svg></span></button>
                    <div class="edit-category-menu">
                        ${options}
                    </div>
                </div>
            `;
        }

        function toggleCategoryPicker(event, id) {
            event.stopPropagation();
            document.querySelectorAll('.edit-category-picker.open').forEach(picker => {
                if (picker.id !== `category-picker-${id}`) picker.classList.remove('open');
            });
            const picker = document.getElementById(`category-picker-${id}`);
            if (picker) picker.classList.toggle('open');
        }

        function selectEditCategory(event, id, category) {
            event.stopPropagation();
            const picker = document.getElementById(`category-picker-${id}`);
            if (!picker) return;
            picker.dataset.selected = category;
            const trigger = picker.querySelector('.edit-category-trigger-label');
            if (trigger) trigger.textContent = category;
            picker.querySelectorAll('.edit-category-option').forEach(option => {
                option.classList.toggle('active', option.textContent === category);
            });
            picker.classList.remove('open');
        }

        // 渲染设定列表
        function renderSettings() {
            const list = document.getElementById('settingsList');
            const header = document.getElementById('categoryHeader');
            const searchTerm = document.getElementById('searchBox').value.trim().toLowerCase();
            
            let filteredSettings = settings;
            
            // 按分类筛选
            if (currentCategory !== 'all') {
                filteredSettings = settings.filter(s => s.category === currentCategory);
                header.textContent = currentCategory;
            } else {
                header.textContent = '全部设定';
            }
            
            // 按搜索词筛选
            if (searchTerm) {
                filteredSettings = filteredSettings.filter(s => 
                    s.content.toLowerCase().includes(searchTerm)
                );
            }

            if (!isUncategorizedView()) {
                organizeMode = false;
                batchSelectedIds.clear();
            }

            updateLibraryCount(filteredSettings.length);
            renderBatchToolbar(filteredSettings.length);
            
            if (filteredSettings.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无设定</div>';
                return;
            }
            
            list.innerHTML = filteredSettings.map((setting, index) => {
                const selected = batchSelectedIds.has(setting.id);
                const itemClass = `setting-item${organizeMode ? ' organizing' : ''}${selected ? ' batch-selected' : ''}`;
                const draggableAttr = organizeMode ? 'false' : 'true';
                const dragHandlers = organizeMode ? '' : `ondragstart="handleDragStart(event, ${setting.id})" ondragover="handleDragOver(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${setting.id})" ondragend="handleDragEnd(event)"`;
                const leading = organizeMode
                    ? `<button type="button" class="batch-check ${selected ? 'selected' : ''}" onclick="toggleBatchSelection(event, ${setting.id})" aria-label="选择条目"></button>`
                    : `<span class="setting-number">#${index + 1}</span>`;

                return `
                <div class="${itemClass}" 
                     id="item-${setting.id}" 
                     draggable="${draggableAttr}"
                     ${dragHandlers}>
                    ${leading}
                    <div class="setting-content" id="content-${setting.id}">${escapeHtml(setting.content)}</div>
                    <div class="edit-area" id="edit-${setting.id}">
                        ${renderCategoryPicker(setting)}
                        <textarea class="edit-textarea" id="textarea-${setting.id}" oninput="autoResizeTextarea(this)">${escapeHtml(setting.content)}</textarea>
                    </div>
                    <div class="setting-actions">
                        <button class="btn-edit" onclick="editSetting(${setting.id})">编辑</button>
                        <button class="btn-delete" onclick="deleteSetting(${setting.id})">删除</button>
                        <button class="btn-save" onclick="saveSetting(${setting.id})">保存</button>
                        <button class="btn-cancel edit-cancel" onclick="cancelEdit(${setting.id})">取消</button>
                    </div>
                </div>
            `;
            }).join('');
        }
        
        // 拖拽处理函数
        function handleDragStart(e, id) {
            draggedItem = id;
            draggedCategory = null;
            dragMode = 'setting';
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }
        
        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }
        
        function handleDragEnter(e) {
            e.currentTarget.classList.add('drag-over');
        }
        
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }
        
        function handleDrop(e, targetId) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.currentTarget.classList.remove('drag-over');
            
            if (dragMode === 'setting' && draggedItem !== targetId) {
                const draggedIndex = settings.findIndex(s => s.id === draggedItem);
                const targetIndex = settings.findIndex(s => s.id === targetId);
                
                const draggedSetting = settings[draggedIndex];
                settings.splice(draggedIndex, 1);
                settings.splice(targetIndex, 0, draggedSetting);
                
                updateLastModified();
                renderSettings();
            }
            
            return false;
        }
        
        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.setting-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('category-drop-over');
                item.classList.remove('dragging');
            });
            draggedItem = null;
            draggedCategory = null;
            dragMode = null;
        }

        function handleCategorySortStart(e, category) {
            draggedCategory = category;
            draggedItem = null;
            dragMode = 'category';
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleCategoryDragOver(e) {
            if (!dragMode) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleCategoryDragEnter(e) {
            if (!dragMode) return;
            e.currentTarget.classList.add('category-drop-over');
        }

        function handleCategoryDragLeave(e) {
            e.currentTarget.classList.remove('category-drop-over');
        }

        function handleCategoryDrop(e, category) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('category-drop-over');

            if (dragMode === 'category' && draggedCategory && draggedCategory !== category) {
                const draggedIndex = categories.indexOf(draggedCategory);
                const targetIndex = categories.indexOf(category);
                if (draggedIndex > -1 && targetIndex > -1) {
                    const [movedCategory] = categories.splice(draggedIndex, 1);
                    categories.splice(targetIndex, 0, movedCategory);
                    saveSettings();
                    renderCategories();
                }
            }

            if (dragMode === 'setting' && draggedItem) {
                const setting = settings.find(s => s.id === draggedItem);
                if (setting && setting.category !== category) {
                    setting.category = category;
                    updateLastModified();
                    renderCategories();
                    renderSettings();
                }
            }

            draggedItem = null;
            draggedCategory = null;
            dragMode = null;
        }

        function handleCategorySortEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('category-drop-over');
                item.classList.remove('dragging');
            });
            draggedCategory = null;
            if (dragMode === 'category') {
                dragMode = null;
            }
        }
        
        // 自动展开编辑框，避免内部滚动条
        function autoResizeTextarea(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            const minHeight = 118;
            const nextHeight = Math.max(textarea.scrollHeight + 2, minHeight);
            textarea.style.height = `${nextHeight}px`;
        }

        // 编辑设定
        function editSetting(id) {
            document.getElementById(`content-${id}`).style.display = 'none';
            document.getElementById(`edit-${id}`).classList.add('active');
            document.getElementById(`item-${id}`).classList.add('editing');
            const textarea = document.getElementById(`textarea-${id}`);
            requestAnimationFrame(() => {
                autoResizeTextarea(textarea);
                textarea.focus();
            });
        }
        
        // 保存编辑
        function saveSetting(id) {
            const newContent = document.getElementById(`textarea-${id}`).value.trim();
            
            if (!newContent) {
                alert('内容不能为空');
                return;
            }
            
            const newCategory = document.getElementById(`category-picker-${id}`)?.dataset.selected;
            const setting = settings.find(s => s.id === id);
            if (setting) {
                setting.content = newContent;
                if (newCategory && categories.includes(newCategory)) {
                    setting.category = newCategory;
                }
                updateLastModified();
                renderCategories();
                renderSettings();
            }
        }
        
        // 取消编辑
        function cancelEdit(id) {
            const setting = settings.find(s => s.id === id);
            if (setting) {
                document.getElementById(`textarea-${id}`).value = setting.content;
                const picker = document.getElementById(`category-picker-${id}`);
                if (picker) {
                    picker.dataset.selected = setting.category;
                    picker.classList.remove('open');
                    const trigger = picker.querySelector('.edit-category-trigger-label');
                    if (trigger) trigger.textContent = setting.category;
                    picker.querySelectorAll('.edit-category-option').forEach(option => {
                        option.classList.toggle('active', option.textContent === setting.category);
                    });
                }
            }
            document.getElementById(`content-${id}`).style.display = 'block';
            document.getElementById(`edit-${id}`).classList.remove('active');
            document.getElementById(`item-${id}`).classList.remove('editing');
        }
        
        // 删除设定
        function deleteSetting(id) {
            if (!confirm('确定要删除这条设定吗？')) {
                return;
            }
            
            settings = settings.filter(s => s.id !== id);
            updateLastModified();
            renderCategories();
            renderSettings();
        }
        
        // 添加分类
        function showAddCategoryModal() {
            document.getElementById('addCategoryModal').classList.add('active');
            document.getElementById('categoryNameInput').focus();
        }
        
        function showManageCategoryModal(event, category) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (!category || category === getDefaultCategory()) return;

            managingCategory = category;
            const input = document.getElementById('manageCategoryNameInput');
            const note = document.getElementById('deleteCategoryNote');
            const deleteBtn = document.getElementById('deleteCategoryBtn');

            if (input) input.value = category;

            const count = settings.filter(s => s.category === category).length;
            if (note) {
                note.textContent = count > 0
                    ? `删除后，${count} 条设定会移入${getDefaultCategory()}。`
                    : '';
            }
            if (deleteBtn) deleteBtn.style.display = 'inline-flex';

            document.getElementById('manageCategoryModal').classList.add('active');
            setTimeout(() => {
                if (input) {
                    input.focus();
                    input.select();
                }
            }, 0);
        }

        function renameCategory() {
            if (!managingCategory) return;

            const input = document.getElementById('manageCategoryNameInput');
            const newName = input.value.trim();
            const oldName = managingCategory;

            if (!newName) {
                alert('请输入分类名称');
                return;
            }

            if (newName === getDefaultCategory() && oldName !== getDefaultCategory()) {
                alert('分类已存在');
                return;
            }

            if (newName !== oldName && categories.includes(newName)) {
                alert('分类已存在');
                return;
            }

            const index = categories.indexOf(oldName);
            if (index === -1) return;

            categories[index] = newName;
            settings.forEach(setting => {
                if (setting.category === oldName) {
                    setting.category = newName;
                }
            });

            if (currentCategory === oldName) {
                currentCategory = newName;
            }

            managingCategory = null;
            updateLastModified();
            renderCategories();
            renderSettings();
            closeModal('manageCategoryModal');
        }

        function deleteCategory() {
            if (!managingCategory || managingCategory === getDefaultCategory()) return;

            const category = managingCategory;
            const count = settings.filter(s => s.category === category).length;
            const message = count > 0
                ? `确定删除分类「${category}」吗？\n\n${count} 条设定会移入「${getDefaultCategory()}」。`
                : `确定删除分类「${category}」吗？`;

            if (!confirm(message)) return;

            settings.forEach(setting => {
                if (setting.category === category) {
                    setting.category = getDefaultCategory();
                }
            });

            categories = categories.filter(cat => cat !== category);

            if (currentCategory === category) {
                currentCategory = getDefaultCategory();
            }

            if (!isUncategorizedView()) {
                organizeMode = false;
                batchSelectedIds.clear();
            }

            managingCategory = null;
            updateLastModified();
            renderCategories();
            renderSettings();
            closeModal('manageCategoryModal');
        }

        function addCategory() {
            const input = document.getElementById('categoryNameInput');
            const name = input.value.trim();
            
            if (!name) {
                alert('请输入分类名称');
                return;
            }
            
            if (categories.includes(name)) {
                alert('分类已存在');
                return;
            }
            
            categories.push(name);
            input.value = '';
            saveSettings();
            renderCategories();
            closeModal('addCategoryModal');
        }
        
        // 显示导出模态框
        function showExportModal() {
            if (settings.length === 0) {
                alert('暂无设定可导出');
                return;
            }
            document.getElementById('exportModal').classList.add('active');
        }
        
        function formatExportTimestamp() {
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yy}${mm}${dd}_${hh}${min}`;
        }

        function getExportFilename(type) {
            return `BetweenInTheClouds_${type}_${formatExportTimestamp()}.${type}`;
        }

        // 纯文字导出
        function exportPlainText() {
            const text = settings.map(s => s.content).join('\n\n');
            downloadFile(text, getExportFilename('txt'));
            closeModal('exportModal');
        }
        
        // 带分类导出
        function exportWithCategories() {
            const data = {
                settings: settings,
                categories: categories,
                lastModified: lastModified,
                exportTime: new Date().toLocaleString('zh-CN')
            };
            
            const text = JSON.stringify(data, null, 2);
            downloadFile(text, getExportFilename('json'));
            closeModal('exportModal');
        }
        
        // 下载文件
        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 导入设定
        function importSettings(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    
                    // 尝试解析为JSON（带分类导出的格式）
                    try {
                        const data = JSON.parse(content);
                        
                        if (!confirm(`将导入 ${data.settings.length} 条设定，${data.categories.length} 个分类\n\n注意：这将覆盖当前所有设定！`)) {
                            return;
                        }
                        
                        settings = data.settings || [];
                        categories = data.categories || ['未分类'];
                        lastModified = data.lastModified || null;
                        
                    } catch {
                        // 如果不是JSON，作为纯文字处理
                        const items = content.split('\n\n').filter(s => s.trim());
                        
                        if (!confirm(`将导入 ${items.length} 条设定（纯文字格式）\n\n注意：这将覆盖当前所有设定！`)) {
                            return;
                        }
                        
                        settings = items.map((item, index) => ({
                            id: Date.now() + index,
                            content: item.trim(),
                            category: categories[0],
                            created: new Date().toLocaleString('zh-CN')
                        }));
                        
                        updateLastModified();
                    }
                    
                    organizeMode = false;
                    batchSelectedIds.clear();
                    saveSettings();
                    renderCategories();
                    renderSettings();
                    updateFooter();
                    alert('导入成功！');
                    
                } catch (error) {
                    alert('导入失败，文件格式可能有误');
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        // 更新底部状态
        function updateFooter() {
            updateLibraryCount();
            
            if (lastModified) {
                document.getElementById('lastModified').textContent = `最后修改: ${lastModified.time}`;
            } else {
                document.getElementById('lastModified').textContent = '从未修改';
            }
        }
        
        // 关闭模态框
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            if (id === 'manageCategoryModal') {
                managingCategory = null;
            }
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // JS字符串转义，用于内联事件中的分类名
        function escapeJs(text) {
            return String(text)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");
        }
        
        document.addEventListener('click', function() {
            document.querySelectorAll('.edit-category-picker.open').forEach(picker => picker.classList.remove('open'));
        });

        // 搜索功能
        document.getElementById('searchBox').addEventListener('input', function() {
            batchSelectedIds.clear();
            renderSettings();
        });
        
        // 输入区快捷添加：Enter 添加条目，Shift + Enter 换行
        let isComposingText = false;
        const newSettingInput = document.getElementById('newSetting');

        newSettingInput.addEventListener('input', function() {
            clearDuplicateNotice();
            this.style.height = '44px';
            this.style.height = Math.min(Math.max(this.scrollHeight, 44), 126) + 'px';
        });

        newSettingInput.addEventListener('compositionstart', function() {
            isComposingText = true;
        });

        newSettingInput.addEventListener('compositionend', function() {
            isComposingText = false;
        });

        newSettingInput.addEventListener('keydown', function(e) {
            if (
                e.key === 'Enter' &&
                !e.shiftKey &&
                !isComposingText &&
                !e.isComposing
            ) {
                e.preventDefault();
                addSetting();
            }
        });
        
        // 分类输入框回车支持
        document.getElementById('categoryNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                addCategory();
            }
        });
        
        document.getElementById('manageCategoryNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                renameCategory();
            }
        });
        
        // 点击模态框外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });
        


        let libraryExpanded = false;

        function toggleLibrary() {
            libraryExpanded = !libraryExpanded;
            updateLibraryState();
        }

        function updateLibraryState() {
            const panel = document.getElementById('libraryPanel');
            const toggle = document.getElementById('libraryToggle');
            if (!panel || !toggle) return;

            panel.classList.toggle('open', libraryExpanded);
            panel.setAttribute('aria-hidden', libraryExpanded ? 'false' : 'true');
            toggle.classList.toggle('open', libraryExpanded);
            toggle.setAttribute('aria-expanded', libraryExpanded ? 'true' : 'false');
        }

        // 页面加载时初始化
        loadSettings();
        updateLibraryState();
    </script>
</body>
</html>
