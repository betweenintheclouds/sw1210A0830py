            'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js'
        ];
        let firebaseSyncAvailable = false;
        let firebaseSyncInitPromise = null;
        let syncAuth = null;
        let syncDb = null;
        let syncCurrentUser = null;
        let syncBusy = false;
        let syncLastCloudSummary = null;
        
        // 生成内容哈希（简单版本）
        function generateHash(text) {
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                const char = text.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36);
        }
        
        // 生成当前设定库的稳定内容快照：分类顺序、条目文字、条目分类、条目顺序
        function getCanonicalLibrarySnapshot(sourceSettings = settings, sourceCategories = categories) {
            return {
                categories: (sourceCategories || ['未分类']).map(cat => String(cat)),
                settings: (sourceSettings || []).map(setting => ({
                    content: String(setting.content || ''),
                    category: String(setting.category || getDefaultCategory())
                }))
            };
        }

        async function sha256Text(text) {
            if (window.crypto && window.crypto.subtle && window.TextEncoder) {
                const data = new TextEncoder().encode(text);
                const digest = await window.crypto.subtle.digest('SHA-256', data);
                const bytes = Array.from(new Uint8Array(digest));
                return 'sha256:' + bytes.map(byte => byte.toString(16).padStart(2, '0')).join('');
            }

            // 极旧浏览器兜底。正常 iOS Safari / Chrome / Edge 都会走 SHA-256。
            return 'legacy:' + generateHash(text);
        }

        // 计算设定库内容版本哈希，不包含 id、created、导出时间等元数据
        async function calculateContentHash(sourceSettings = settings, sourceCategories = categories) {
            const content = JSON.stringify(getCanonicalLibrarySnapshot(sourceSettings, sourceCategories));
            return await sha256Text(content);
        }

        function getNowString() {
            return new Date().toLocaleString('zh-CN');
        }

        function formatIsoForDevice(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleString('zh-CN');
        }

        function formatCloudTimestampForDevice(value) {
            if (!value) return '';
            let date = null;

            if (typeof value.toDate === 'function') {
                date = value.toDate();
            } else if (value instanceof Date) {
                date = value;
            } else if (typeof value === 'string') {
                date = new Date(value);
            } else if (typeof value.seconds === 'number') {
                date = new Date(value.seconds * 1000 + Math.floor((value.nanoseconds || 0) / 1000000));
            }

            if (!date || Number.isNaN(date.getTime())) return '';
            return date.toLocaleString('zh-CN');
        }

        async function ensureVersionState() {
            const dataHash = await calculateContentHash();
            if (!versionHistory || typeof versionHistory !== 'object') {
                versionHistory = {};
            }

            if (!versionHistory[dataHash]) {
                if (lastModified && lastModified.hash === dataHash && lastModified.time) {
                    versionHistory[dataHash] = lastModified.time;
                } else if (lastModified && lastModified.time && Object.keys(versionHistory).length === 0) {
                    versionHistory[dataHash] = lastModified.time;
                } else {
                    versionHistory[dataHash] = getNowString();
                }
            }

            lastModified = {
                time: versionHistory[dataHash],
                hash: dataHash,
                versionTime: versionHistory[dataHash],
                contentHash: dataHash
            };

            return lastModified;
        }

        // 更新内容版本时间
        async function updateLastModified() {
            await ensureVersionState();
            await saveSettings(false);
            updateFooter();
        }

        // 加载设定
        async function loadSettings() {
            const saved = localStorage.getItem('silvanSettings');
            if (saved) {
                const data = JSON.parse(saved);
                settings = data.settings || [];
                categories = data.categories || ['未分类'];
                lastModified = data.lastModified || null;
                versionHistory = data.versionHistory || {};
            }
            await ensureVersionState();
            renderCategories();
            renderSettings();
            updateFooter();
            await saveSettings(false);
        }

        // 保存设定
        async function saveSettings(ensure = true) {
            if (ensure) {
                await ensureVersionState();
            }
            const data = {
                settings: settings,
                categories: categories,
                lastModified: lastModified,
                versionHistory: versionHistory
            };
            localStorage.setItem('silvanSettings', JSON.stringify(data));
        }

        function updateLibraryCount(count) {
            const countEl = document.getElementById('totalCount');
            const mobileCollapsedTotal = document.getElementById('mobileCollapsedTotal');
            if (!countEl) return;

            let displayCount = count;
            if (typeof displayCount !== 'number') {
                displayCount = currentCategory === 'all'
                    ? settings.length
                    : settings.filter(s => s.category === currentCategory).length;
            }

            countEl.textContent = `共 ${displayCount} 条设定`;

            if (mobileCollapsedTotal) {
                mobileCollapsedTotal.textContent = `共 ${settings.length} 条设定`;
            }
        }

            return !!document.querySelector('.setting-item.editing');
        }

            }

            organizeMode = true;
            batchSelectedIds.clear();

            if (batchSelectedIds.has(id)) {

            } else {
                batchSelectedIds.add(id);
            }
            renderSettings();

            settings.forEach(setting => {

                }

        function normalizeForDuplicate(text) {
            return (text || '')
                .trim()
                .replace(/　/g, ' ')
                .replace(/\s+/g, ' ')
                .toLowerCase();
        }

        function findDuplicateSetting(content) {
            const normalized = normalizeForDuplicate(content);
            if (!normalized) return null;
            return settings.find(setting => normalizeForDuplicate(setting.content) === normalized) || null;
        }

        function showDuplicateNotice(setting) {
            similarCandidateId = setting.id;
            similarCandidateContent = setting.content;

            const notice = document.getElementById('duplicateNotice');
            if (notice) notice.classList.add('active');

            jumpToSimilarSetting();
        }

        function clearDuplicateNotice() {
            similarCandidateId = null;
            similarCandidateContent = '';

            const notice = document.getElementById('duplicateNotice');
            if (notice) notice.classList.remove('active');

            document.querySelectorAll('.setting-item.similar-highlight').forEach(item => {
                item.classList.remove('similar-highlight');
            });
        }

        function jumpToSimilarSetting() {
            if (!similarCandidateId) return;

            libraryExpanded = true;
            currentCategory = 'all';
            updateLibraryState();
            renderCategories();
            renderSettings();

            setTimeout(() => {
                const item = document.getElementById(`item-${similarCandidateId}`);
                if (!item) return;
                item.classList.add('similar-highlight');
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 80);
        }

        // 添加设定
        async function addSetting(forceAdd = false) {
            const input = document.getElementById('newSetting');
            const content = input.value.trim();
            
            if (!content) {
                showPrettyAlert('请输入内容', 'warning');
                return;
            }

            if (!forceAdd) {
                const duplicate = findDuplicateSetting(content);
                if (duplicate) {
                    showDuplicateNotice(duplicate);
                    return;
                }
            }
            
            const category = currentCategory === 'all' ? categories[0] : currentCategory;
            
            settings.push({
                id: Date.now(),
                content: content,
                category: category,
                created: new Date().toLocaleString('zh-CN')
            });
            
            input.value = '';
            input.style.height = '44px';
            clearDuplicateNotice();
            await updateLastModified();
            renderCategories();
            renderSettings();
            
            // 滚动到底部
            setTimeout(() => {
                const contentArea = document.getElementById('contentArea');
                if (contentArea) contentArea.scrollTop = contentArea.scrollHeight;
            }, 100);
        }
        
        function renderCategoryOptions(selectedCategory) {
            return categories.map(cat => `
                <option value="${escapeHtml(cat)}" ${cat === selectedCategory ? 'selected' : ''}>${escapeHtml(cat)}</option>

        }

        function renderCategoryPicker(setting) {
            const options = categories.map(cat => `

            `).join('');
            return `
                <div class="edit-category-picker" id="category-picker-${setting.id}" data-selected="${escapeHtml(setting.category)}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">
                    <button type="button" class="edit-category-trigger" onclick="toggleCategoryPicker(event, ${setting.id})"><span class="edit-category-trigger-label">${escapeHtml(setting.category)}</span><span class="edit-category-trigger-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 7.5l5 5 5-5"></path></svg></span></button>
                    <div class="edit-category-menu">
                        ${options}
                    </div>
                </div>
            `;
        }

        function closeAllCategoryPickers(exceptId = null) {
            document.querySelectorAll('.edit-category-picker.open').forEach(picker => {
                if (exceptId && picker.id === exceptId) return;
                picker.classList.remove('open');
                picker.closest('.setting-item')?.classList.remove('category-menu-open');
            });
        }

        function toggleCategoryPicker(event, id) {
            event.stopPropagation();
            const pickerId = `category-picker-${id}`;
            closeAllCategoryPickers(pickerId);
            const picker = document.getElementById(pickerId);
            if (!picker) return;
            const willOpen = !picker.classList.contains('open');
            picker.classList.toggle('open', willOpen);
            picker.closest('.setting-item')?.classList.toggle('category-menu-open', willOpen);
        }

        function selectEditCategory(event, id, category) {
            event.stopPropagation();
            const picker = document.getElementById(`category-picker-${id}`);
            if (!picker) return;
            picker.dataset.selected = category;
            const trigger = picker.querySelector('.edit-category-trigger-label');
            if (trigger) trigger.textContent = category;
            picker.querySelectorAll('.edit-category-option').forEach(option => {
                option.classList.toggle('active', option.textContent === category);

            picker.classList.remove('open');
            picker.closest('.setting-item')?.classList.remove('category-menu-open');

        // 渲染设定列表
        function renderSettings() {
            const list = document.getElementById('settingsList');
            const header = document.getElementById('categoryHeader');
            const searchTerm = document.getElementById('searchBox').value.trim().toLowerCase();
            
            let filteredSettings = settings;
            
            // 按分类筛选
            if (currentCategory !== 'all') {
                filteredSettings = settings.filter(s => s.category === currentCategory);
                header.textContent = currentCategory;
            } else {
                header.textContent = '全部设定';
            }
            
            // 按搜索词筛选
            if (searchTerm) {
                filteredSettings = filteredSettings.filter(s => 
                    s.content.toLowerCase().includes(searchTerm)
                );
            }

            if (currentCategory === 'all' || searchTerm || isEditingAnySetting()) {
                organizeMode = false;
                batchSelectedIds.clear();
            }

            updateLibraryCount(filteredSettings.length);
            renderBatchToolbar(filteredSettings.length);
            updateMobileScrollBottomVisibility();
            
            if (filteredSettings.length === 0) {
                list.innerHTML = '<div class="empty-state">暂无设定</div>';
                return;
            }
            
            list.innerHTML = filteredSettings.map((setting, index) => {
                const selected = batchSelectedIds.has(setting.id);
                const itemClass = `setting-item${organizeMode ? ' organizing' : ''}${selected ? ' batch-selected' : ''}`;
                const draggableAttr = organizeMode ? 'false' : 'true';
                const dragHandlers = organizeMode ? '' : `ondragstart="handleDragStart(event, ${setting.id})" ondragover="handleDragOver(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${setting.id})" ondragend="handleDragEnd(event)"`;
                const leading = organizeMode
                    ? `<button type="button" class="batch-check ${selected ? 'selected' : ''}" onclick="toggleBatchSelection(event, ${setting.id})" aria-label="选择条目"></button>`
                    : `<span class="setting-number">#${index + 1}</span><button type="button" class="mobile-item-menu-btn" aria-label="条目操作" onclick="toggleMobileInlineActions(event, ${setting.id})">⋯</button>`;

                return `
                <div class="${itemClass}" 
                     id="item-${setting.id}" 
                     draggable="${draggableAttr}"
                     ${dragHandlers}>
                    ${leading}
                    <div class="setting-content" id="content-${setting.id}">${escapeHtml(setting.content)}</div>
                    ${!organizeMode ? `<div class="mobile-inline-actions ${mobileOpenMenuId === setting.id ? 'active' : ''}" id="mobile-actions-${setting.id}">
                        <button type="button" class="btn-edit" onclick="editSetting(${setting.id})">编辑</button>
                        <button type="button" class="btn-delete" onclick="deleteSetting(${setting.id})">删除</button>
                    </div>` : ''}
                    <div class="edit-area" id="edit-${setting.id}">
                        ${renderCategoryPicker(setting)}
                        <textarea class="edit-textarea" id="textarea-${setting.id}" oninput="autoResizeTextarea(this)">${escapeHtml(setting.content)}</textarea>
                    </div>
                    <div class="setting-actions">
                        <button class="btn-edit" onclick="editSetting(${setting.id})">编辑</button>
                        <button class="btn-delete" onclick="deleteSetting(${setting.id})">删除</button>
                        <button class="btn-save" onclick="saveSetting(${setting.id})">保存</button>
                        <button class="btn-cancel edit-cancel" onclick="cancelEdit(${setting.id})">取消</button>
                    </div>
                </div>
            `;
            }).join('');
        }
        
        // 拖拽处理函数
        function handleDragStart(e, id) {
            draggedItem = id;
            draggedCategory = null;
            dragMode = 'setting';
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }
        
        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }
        
        function handleDragEnter(e) {
            e.currentTarget.classList.add('drag-over');
        }
        
        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }
        
        async function handleDrop(e, targetId) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            e.currentTarget.classList.remove('drag-over');
            
            if (dragMode === 'setting' && draggedItem !== targetId) {
                const draggedIndex = settings.findIndex(s => s.id === draggedItem);
                const targetIndex = settings.findIndex(s => s.id === targetId);
                
                const draggedSetting = settings[draggedIndex];
                settings.splice(draggedIndex, 1);
                settings.splice(targetIndex, 0, draggedSetting);
                
                await updateLastModified();
                renderSettings();
            }
            
            return false;
        }
        
        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.setting-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('category-drop-over');
                item.classList.remove('dragging');
            });
            draggedItem = null;
            draggedCategory = null;
            dragMode = null;
        }

        function handleCategorySortStart(e, category) {
            draggedCategory = category;
            draggedItem = null;
            dragMode = 'category';
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleCategoryDragOver(e) {
            if (!dragMode) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleCategoryDragEnter(e) {
            if (!dragMode) return;
            e.currentTarget.classList.add('category-drop-over');
        }

        function handleCategoryDragLeave(e) {
            e.currentTarget.classList.remove('category-drop-over');
        }

        async function handleCategoryDrop(e, category) {
            e.preventDefault();
            e.stopPropagation();
            e.currentTarget.classList.remove('category-drop-over');

            if (dragMode === 'category' && draggedCategory && draggedCategory !== category) {
                const draggedIndex = categories.indexOf(draggedCategory);
                const targetIndex = categories.indexOf(category);
                if (draggedIndex > -1 && targetIndex > -1) {
                    const [movedCategory] = categories.splice(draggedIndex, 1);
                    categories.splice(targetIndex, 0, movedCategory);
                    await saveSettings();
                    renderCategories();
                }
            }

            if (dragMode === 'setting' && draggedItem) {
                const setting = settings.find(s => s.id === draggedItem);
                if (setting && setting.category !== category) {
                    setting.category = category;
                    await updateLastModified();
                    renderCategories();
                    renderSettings();
                }
            }

            draggedItem = null;
            draggedCategory = null;
            dragMode = null;
        }

        function handleCategorySortEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.category-item').forEach(item => {
                item.classList.remove('category-drop-over');
                item.classList.remove('dragging');
            });
            draggedCategory = null;
            if (dragMode === 'category') {
                dragMode = null;
            }
        }
        
        // 自动展开编辑框，避免内部滚动条
        function autoResizeTextarea(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            const minHeight = 118;
            const nextHeight = Math.max(textarea.scrollHeight + 2, minHeight);
            textarea.style.height = `${nextHeight}px`;
        }

        // 编辑设定
        function editSetting(id) {
            mobileOpenMenuId = null;
            document.getElementById(`content-${id}`).style.display = 'none';
            document.getElementById(`edit-${id}`).classList.add('active');
            document.getElementById(`item-${id}`).classList.add('editing');
            const textarea = document.getElementById(`textarea-${id}`);
            requestAnimationFrame(() => {
                autoResizeTextarea(textarea);
                textarea.focus();
            });
        }
        
        // 保存编辑
        async function saveSetting(id) {
            const newContent = document.getElementById(`textarea-${id}`).value.trim();
            
            if (!newContent) {
                showPrettyAlert('内容不能为空', 'warning');
                return;
            }
            
            const newCategory = document.getElementById(`category-picker-${id}`)?.dataset.selected;
            const setting = settings.find(s => s.id === id);
            if (setting) {
                setting.content = newContent;
                if (newCategory && categories.includes(newCategory)) {
                    setting.category = newCategory;
                }
                await updateLastModified();
                renderCategories();
                renderSettings();
            }
        }
        
        // 取消编辑
        function cancelEdit(id) {
            const setting = settings.find(s => s.id === id);
            if (setting) {
                document.getElementById(`textarea-${id}`).value = setting.content;
                const picker = document.getElementById(`category-picker-${id}`);
                if (picker) {
                    picker.dataset.selected = setting.category;
                    picker.classList.remove('open');
                    const trigger = picker.querySelector('.edit-category-trigger-label');
                    if (trigger) trigger.textContent = setting.category;
                    picker.querySelectorAll('.edit-category-option').forEach(option => {
                        option.classList.toggle('active', option.textContent === setting.category);
                    });
                }
            }
            document.getElementById(`content-${id}`).style.display = 'block';
            document.getElementById(`edit-${id}`).classList.remove('active');
            document.getElementById(`item-${id}`).classList.remove('editing');
        }
        
        // 删除设定
        async function deleteSetting(id) {

        async function renameCategory() {
            if (!managingCategory) return;

            const input = document.getElementById('manageCategoryNameInput');
            const newName = input.value.trim();
            const oldName = managingCategory;

            if (!newName) {
                showPrettyAlert('请输入分类名称', 'warning');
                return;
            }

            if (newName === getDefaultCategory() && oldName !== getDefaultCategory()) {
                showPrettyAlert('分类已存在', 'warning');
                return;
            }

            if (newName !== oldName && categories.includes(newName)) {
                showPrettyAlert('分类已存在', 'warning');
                return;
            }

            const index = categories.indexOf(oldName);
            if (index === -1) return;

            categories[index] = newName;
            settings.forEach(setting => {
                if (setting.category === oldName) {
                    setting.category = newName;
                }
            });

            if (currentCategory === oldName) {
                currentCategory = newName;
            }

            managingCategory = null;
            await updateLastModified();
            renderCategories();
            renderSettings();
            closeModal('manageCategoryModal');
        }

        async function deleteCategory() {
            if (!managingCategory || managingCategory === getDefaultCategory()) return;

            const category = managingCategory;
            const count = settings.filter(s => s.category === category).length;
            const message = count > 0
                ? `确定删除分类「${category}」吗？\n\n${count} 条设定会移入「${getDefaultCategory()}」。`
                : `确定删除分类「${category}」吗？`;

            const confirmed = await showPrettyConfirm({
                title: '删除分类',
                message: message,
                okText: '删除',
                cancelText: '取消'
            });

            if (!confirmed) return;

            settings.forEach(setting => {
                if (setting.category === category) {
                    setting.category = getDefaultCategory();
                }
            });

            categories = categories.filter(cat => cat !== category);

            if (currentCategory === category) {
                currentCategory = getDefaultCategory();
            }

            if (!isUncategorizedView()) {
                organizeMode = false;
                batchSelectedIds.clear();

            managingCategory = null;

            renderSettings();

        function formatExportTimestamp() {
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            return `${yy}${mm}${dd}_${hh}${min}`;
        }

        // 纯文字导出：按分类顺序分组
        function exportPlainText() {
            const sections = [];
            categories.forEach(category => {
                const items = settings.filter(setting => setting.category === category);
                if (!items.length) return;
                sections.push(`【${category}】\n\n${items.map(item => item.content).join('\n\n')}`);
            });

            const knownCategories = new Set(categories);
            const extraItems = settings.filter(setting => !knownCategories.has(setting.category));
            if (extraItems.length) {
                sections.push(`【未分类】\n\n${extraItems.map(item => item.content).join('\n\n')}`);
            }

            const text = sections.join('\n\n');
            downloadFile(text, getExportFilename('txt'));

        function getMimeTypeForFilename(filename) {
            const lower = String(filename || '').toLowerCase();
            if (lower.endsWith('.json')) return 'application/json;charset=utf-8';
            if (lower.endsWith('.txt')) return 'text/plain;charset=utf-8';
            return 'application/octet-stream';
        }

        // 下载文件
        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: getMimeTypeForFilename(filename) });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

                    syncCurrentUser = user || syncAuth.currentUser || null;
                    resolve(syncCurrentUser);

        function loadExternalScript(src) {
            return new Promise((resolve, reject) => {
                const existing = document.querySelector(`script[src="${src}"]`);
                if (existing) {
                    if (existing.dataset.loaded === 'true') {
                        resolve();
                    } else {
                        existing.addEventListener('load', resolve, { once: true });
                        existing.addEventListener('error', () => reject(new Error(`无法加载 ${src}`)), { once: true });
                    }
                    return;
                }

                const script = document.createElement('script');
                script.src = src;
                script.async = false;
                script.dataset.loaded = 'false';
                script.onload = () => {
                    script.dataset.loaded = 'true';
                    resolve();
                };
                script.onerror = () => reject(new Error(`无法加载 ${src}`));
                document.head.appendChild(script);
            });
        }

        async function loadFirebaseSdk() {
            if (window.firebase && firebase.auth && firebase.firestore) return;
            for (const src of FIREBASE_SDK_URLS) {
                await loadExternalScript(src);
            }
        }

        async function ensureFirebaseSyncReady() {
            if (firebaseSyncAvailable && syncAuth && syncDb) return true;
            if (firebaseSyncInitPromise) return firebaseSyncInitPromise;

            firebaseSyncInitPromise = (async () => {
                updateSyncUi('正在连接 Firebase 同步服务...');
                await loadFirebaseSdk();

                if (!window.firebase) {
                    throw new Error('Firebase SDK 未加载');
                }

                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }

                syncAuth = firebase.auth();
                syncDb = firebase.firestore();
                firebaseSyncAvailable = true;

                try {
                    await syncAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                } catch (error) {
                    console.warn('Firebase persistence setup failed:', error);
                }

                syncAuth.onAuthStateChanged(user => {
                    syncCurrentUser = user;
                    updateSyncUi();
                    const modalOpen = document.getElementById('syncModal')?.classList.contains('active');
                    if (modalOpen && isAllowedSyncUser()) {
                        showCloudSyncStatus(false).catch(error => console.warn(error));
                    }
                });

                bindSyncInputEvents();
                updateSyncUi();
                return true;
            })().catch(error => {
                firebaseSyncAvailable = false;
                firebaseSyncInitPromise = null;
                updateSyncUi('Firebase 连接失败。本地设定仍可继续使用。');
                updateSyncDetailsHtml(`
                    <div class="sync-detail-title">连接失败</div>
                    <div>${escapeHtml(getFriendlyFirebaseError(error))}</div>
                `);
                throw error;
            });

            return firebaseSyncInitPromise;
        }

                categories: categories,
                lastModified: lastModified,
                versionHistory: versionHistory,

        function getSummaryFromCloudData(data) {
            if (!data) {
                return {
                    label: '云端版本',
                    exists: false,
                    versionTime: '云端暂无数据',
                    contentHash: '无',
                    settingsCount: 0,
                    categoriesCount: 0,
                    syncUpdatedAt: '从未上传',
                    syncUpdatedAtISO: '',
                    schemaVersion: 'none'
                };
            }

            return {
                label: '云端版本',
                exists: true,
                versionTime: data.versionTime || data.lastModified?.versionTime || data.lastModified?.time || '未知',
                contentHash: data.contentHash || data.lastModified?.contentHash || data.lastModified?.hash || '未知',
                settingsCount: Array.isArray(data.settings) ? data.settings.length : 0,
                categoriesCount: Array.isArray(data.categories) ? data.categories.length : 0,
                syncUpdatedAt: formatCloudTimestampForDevice(data.syncUpdatedAtServer)
                    || formatIsoForDevice(data.syncUpdatedAtISO)
                    || data.syncUpdatedAt
                    || data.exportTime
                    || '未知',
                syncUpdatedAtISO: data.syncUpdatedAtISO || '',
                schemaVersion: data.schemaVersion || 'unknown'
            };
        }

        async function fetchCloudLibrary() {
            await assertSyncReadyAndAllowed();
            const snapshot = await syncDb.doc(SYNC_DOC_PATH).get();
            if (!snapshot.exists) {
                syncLastCloudSummary = getSummaryFromCloudData(null);
                return { exists: false, data: null, summary: syncLastCloudSummary };
            }

            const data = snapshot.data();
            const summary = getSummaryFromCloudData(data);
            syncLastCloudSummary = summary;
            return { exists: true, data, summary };
        }

        function formatLessOverMoreHtml(sourceLabel, sourceCount, targetLabel, targetCount, actionLabel, targetShortLabel) {
            const diff = Math.max(0, targetCount - sourceCount);
            return `

        async function confirmLessOverMoreIfNeeded({ sourceLabel, sourceCount, targetLabel, targetCount, actionLabel, targetShortLabel, okText }) {
            if (sourceCount >= targetCount) return true;
            return await showPrettyConfirm({
                title: `确认继续${actionLabel}？`,
                html: formatLessOverMoreHtml(sourceLabel, sourceCount, targetLabel, targetCount, actionLabel, targetShortLabel),
                okText: okText || `继续${actionLabel}`,
                cancelText: '取消',
                fallbackMessage: `${sourceLabel}：${sourceCount} 条
${targetLabel}：${targetCount} 条

这次${actionLabel}会让${targetShortLabel}减少 ${targetCount - sourceCount} 条设定。`
            });
        }

        async function uploadLocalToCloud() {
            try {
                await assertSyncReadyAndAllowed();
                setSyncBusy(true, '正在读取云端状态...');
                const localSummary = await getLocalSyncSummary();

                if (localSummary.settingsCount === 0) {
                    updateSyncDetailsHtml('');
                    showToast('本地版本为空，已阻止上传。', 'warning');
                    return;
                }

                const cloud = await fetchCloudLibrary();
                const cloudSummary = cloud.summary;

                if (cloud.exists && localSummary.contentHash === cloudSummary.contentHash) {
                    updateSyncDetailsHtml(buildSyncStatusHtml(localSummary, cloudSummary));
                    showToast('本地与云端已经一致', 'success');
                    return;
                }

                setSyncBusy(false);
                const confirmed = await showPrettyConfirm({
                    title: cloud.exists ? '上传到云端' : '首次上传到云端',
                    html: formatSyncCompareHtml(cloud.exists ? '这会用本地版本替换云端版本。' : '这会把本地版本保存为云端版本。', localSummary, cloudSummary),
                    okText: cloud.exists ? '上传本地版本' : '上传',
                    cancelText: '取消',
                    fallbackMessage: '是否上传本地版本？'
                });

                if (!confirmed) return;

                if (cloud.exists) {
                    const lessConfirmed = await confirmLessOverMoreIfNeeded({
                        sourceLabel: '本地版本',
                        sourceCount: localSummary.settingsCount,
                        targetLabel: '云端版本',
                        targetCount: cloudSummary.settingsCount,
                        actionLabel: '上传',
                        targetShortLabel: '云端',
                        okText: '继续上传'
                    });
                    if (!lessConfirmed) return;
                }

                setSyncBusy(true, '正在上传本地版本...');
                const payload = await buildLocalSyncPayload();
                await syncDb.doc(SYNC_DOC_PATH).set(payload);
                const refreshedCloud = await fetchCloudLibrary();
                updateSyncDetailsHtml(buildSyncStatusHtml(await getLocalSyncSummary(), refreshedCloud.summary));
                showToast('已上传到云端', 'success');
            } catch (error) {
                if (error && ['not signed in', 'wrong sync user'].includes(error.message)) return;
                showToast(getFriendlyFirebaseError(error), 'danger');
                updateSyncDetailsHtml(`
                    <div class="sync-detail-title">上传失败</div>
                    <div>${escapeHtml(getFriendlyFirebaseError(error))}</div>
                `);
            } finally {
                setSyncBusy(false);
                updateSyncUi();
            }
        }

        async function applyCloudLibraryToLocal(data) {
            const normalized = normalizeCloudLibraryData(data);
            const hash = data.contentHash || await calculateContentHash(normalized.settings, normalized.categories);
            const versionTime = data.versionTime || data.lastModified?.versionTime || data.lastModified?.time || getNowString();

            settings = normalized.settings;
            categories = normalized.categories;
            versionHistory = normalized.versionHistory;

            if (!versionHistory[hash]) {
                versionHistory[hash] = versionTime;
            }

            lastModified = {
                time: versionHistory[hash],
                hash: hash,
                versionTime: versionHistory[hash],
                contentHash: hash
            };

            currentCategory = 'all';
            organizeMode = false;
            batchSelectedIds.clear();
            document.body.classList.remove('mobile-organize-active');

            await saveSettings();
            renderCategories();
            renderSettings();
            updateFooter();
            updateLibraryState();
        }

        function normalizeCloudLibraryData(data) {
            const baseCategories = Array.isArray(data?.categories) && data.categories.length
                ? data.categories.map(cat => String(cat || '').trim()).filter(Boolean)
                : ['未分类'];

            const categoriesSeen = [];
            baseCategories.forEach(cat => {
                if (cat && !categoriesSeen.includes(cat)) categoriesSeen.push(cat);
            });
            if (!categoriesSeen.length) categoriesSeen.push('未分类');

            const defaultCategory = categoriesSeen[0];
            const rawSettings = Array.isArray(data?.settings) ? data.settings : [];
            const normalizedSettings = rawSettings.map((item, index) => {
                const rawCategory = String(item?.category || defaultCategory).trim() || defaultCategory;
                if (!categoriesSeen.includes(rawCategory)) categoriesSeen.push(rawCategory);

                const numericId = Number(item?.id);
                return {
                    id: Number.isFinite(numericId) ? numericId : Date.now() + index,
                    content: String(item?.content || ''),
                    category: rawCategory,
                    created: item?.created || ''
                };
            });

            const incomingHistory = data?.versionHistory && typeof data.versionHistory === 'object'
                ? { ...data.versionHistory }
                : {};

            return {
                settings: normalizedSettings,
                categories: categoriesSeen,
                versionHistory: incomingHistory
            };
        }

        function getFriendlyFirebaseError(error) {
            const code = error?.code || '';
            const message = error?.message || String(error || '未知错误');

            const map = {
                'auth/invalid-email': 'You shall not pass!',
                'auth/user-disabled': 'You shall not pass!',
                'auth/user-not-found': 'You shall not pass!',
                'auth/wrong-password': 'You shall not pass!',
                'auth/invalid-credential': 'You shall not pass!',
                'auth/too-many-requests': '登录尝试过多，请稍后再试。',
                'permission-denied': 'Firestore 拒绝访问。请确认当前登录的是唯一授权账号，并且安全规则已经发布。',
                'unavailable': '暂时无法连接 Firebase。请检查网络后再试。'
            };

            if (map[code]) return map[code];
            if (message.includes('Failed to fetch') || message.includes('无法加载')) {
                return '无法连接 Firebase SDK。本地设定仍可使用；同步需要能访问 Firebase。';
            }
            return message;
        }


        async function getVersionTimeForImport(sourceSettings, sourceCategories, importedData = null) {
            const hash = await calculateContentHash(sourceSettings, sourceCategories);
            let time = null;

            if (importedData) {
                time = importedData.versionTime
                    || importedData.lastModified?.versionTime
                    || importedData.lastModified?.time
                    || null;
            }

            if (!time && versionHistory && versionHistory[hash]) {
                time = versionHistory[hash];
            }

            if (!time) {
                time = '新版本，导入后记录当前时间';
            }

            return { hash, time };
        }

        async function buildImportConfirmMessage(importInfo) {
            const current = await ensureVersionState();
            return [
                '即将替换当前设定',
                '',
                `导入版本：${importInfo.versionTime}`,
                `导入条目：${importInfo.settingsCount} 条`,
                `导入分类：${importInfo.categoriesCount} 个`,
                '',
                `当前版本：${current ? current.time : '从未修改'}`,
                `当前条目：${settings.length} 条`,
                `当前分类：${categories.length} 个`,
                '',

            ].join('\n');
        }

        // 导入设定
        function importSettings(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const content = e.target.result;

                    // 尝试解析为JSON（完整替换导入）
                    try {
                        const data = JSON.parse(content);
                        const incomingSettings = Array.isArray(data.settings) ? data.settings : [];
                        const incomingCategories = Array.isArray(data.categories) && data.categories.length ? data.categories : ['未分类'];

                        if (incomingSettings.length === 0) {
                            showToast('导入内容为空，已阻止替换。', 'warning');
                            return;
                        }

                        const importVersion = await getVersionTimeForImport(incomingSettings, incomingCategories, data);

                        const confirmed = await showCustomConfirm({
                            title: '替换导入',
                            html: await formatImportConfirmHtml({
                                versionTime: importVersion.time,
                                settingsCount: incomingSettings.length,
                                categoriesCount: incomingCategories.length
                            }),
                            okText: '导入内容',
                            cancelText: '取消',
                            fallbackMessage: await buildImportConfirmMessage({
                                versionTime: importVersion.time,
                                settingsCount: incomingSettings.length,
                                categoriesCount: incomingCategories.length
                            })
                        });

                        if (!confirmed) {
                            return;
                        }

                        const lessConfirmed = await confirmLessOverMoreIfNeeded({
                            sourceLabel: '导入内容',
                            sourceCount: incomingSettings.length,
                            targetLabel: '当前设定',
                            targetCount: settings.length,
                            actionLabel: '导入',
                            targetShortLabel: '本地',
                            okText: '继续导入'
                        });
                        if (!lessConfirmed) {
                            return;
                        }

                        settings = incomingSettings;
                        categories = incomingCategories;
                        versionHistory = {
                            ...(versionHistory || {}),
                            ...(data.versionHistory || {})
                        };

                        if (!versionHistory[importVersion.hash]) {
                            versionHistory[importVersion.hash] = importVersion.time === '新版本，导入后记录当前时间'
                                ? getNowString()
                                : importVersion.time;
                        }

                        lastModified = {
                            time: versionHistory[importVersion.hash],
                            hash: importVersion.hash,
                            versionTime: versionHistory[importVersion.hash],
                            contentHash: importVersion.hash
                        };

                    } catch {
                        // 如果不是JSON，作为纯文字替换导入
                        const items = content.split('\n\n').filter(s => s.trim());
                        const incomingCategories = [getDefaultCategory()];
                        const incomingSettings = items.map((item, index) => ({
                            id: Date.now() + index,
                            content: item.trim(),
                            category: incomingCategories[0],
                            created: new Date().toLocaleString('zh-CN')
                        }));
                        if (incomingSettings.length === 0) {
                            showToast('导入内容为空，已阻止替换。', 'warning');
                            return;
                        }

                        const importVersion = await getVersionTimeForImport(incomingSettings, incomingCategories, null);

                        const confirmed = await showCustomConfirm({
                            title: '替换导入',
                            html: await formatImportConfirmHtml({
                                versionTime: importVersion.time,
                                settingsCount: incomingSettings.length,
                                categoriesCount: incomingCategories.length
                            }),
                            okText: '导入内容',
                            cancelText: '取消',
                            fallbackMessage: await buildImportConfirmMessage({
                                versionTime: importVersion.time,
                                settingsCount: incomingSettings.length,
                                categoriesCount: incomingCategories.length
                            })
                        });

                        if (!confirmed) {
                            return;
                        }

                        const lessConfirmed = await confirmLessOverMoreIfNeeded({
                            sourceLabel: '导入内容',
                            sourceCount: incomingSettings.length,
                            targetLabel: '当前设定',
                            targetCount: settings.length,
                            actionLabel: '导入',
                            targetShortLabel: '本地',
                            okText: '继续导入'
                        });
                        if (!lessConfirmed) {
                            return;
                        }

                        settings = incomingSettings;
                        categories = incomingCategories;
                        if (!versionHistory[importVersion.hash]) {
                            versionHistory[importVersion.hash] = importVersion.time === '新版本，导入后记录当前时间'
                                ? getNowString()
                                : importVersion.time;
                        }
                        lastModified = {
                            time: versionHistory[importVersion.hash],
                            hash: importVersion.hash,
                            versionTime: versionHistory[importVersion.hash],
                            contentHash: importVersion.hash
                        };
                    }

                    organizeMode = false;
                    batchSelectedIds.clear();
                    document.body.classList.remove('mobile-organize-active');
                    await saveSettings();
                    renderCategories();
                    renderSettings();
                    updateFooter();
                    showToast('导入成功', 'success');

                } catch (error) {
                    showToast('导入失败，文件格式可能有误', 'danger');
                    console.error(error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        }

        function openMobileCategoryDrawer() {
            if (!libraryExpanded) {
                libraryExpanded = true;
                updateLibraryState();
            }
            closeMobileTools();
            document.body.classList.add('mobile-category-open');
        }

        function closeMobileCategoryDrawer() {
            document.body.classList.remove('mobile-category-open');
        }

        function toggleMobileSearch() {
            if (!libraryExpanded) {
                libraryExpanded = true;
                updateLibraryState();
            }

            document.body.classList.toggle('mobile-search-open');
            if (document.body.classList.contains('mobile-search-open')) {
                setTimeout(() => {
                    const searchBox = document.getElementById('searchBox');
                    if (searchBox) searchBox.focus();
                }, 0);
            }
        }

        function closeMobileTools() {
            document.body.classList.remove('mobile-tools-open');
            document.body.classList.remove('mobile-search-open');
        }

        function startMobileOrganize() {
            closeMobileCategoryDrawer();
            closeMobileTools();
            enterOrganizeMode();
            renderSettings();
        }

        function toggleMobileInlineActions(event, id) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            mobileOpenMenuId = mobileOpenMenuId === id ? null : id;
            renderSettings();
        }

        function closeMobileInlineActions() {
            mobileOpenMenuId = null;
        }

        function scrollCurrentListToBottom() {
            if (organizeMode) return;

            const btn = document.getElementById('mobileScrollBottomBtn');
            const list = document.getElementById('settingsList');
            const contentArea = document.getElementById('contentArea');
            const libraryMain = document.querySelector('.library-main');

            const isAtBottomMode = btn && btn.classList.contains('at-bottom');

            if (isAtBottomMode) {
                const topTarget = list ? list.firstElementChild : null;

                if (topTarget && typeof topTarget.scrollIntoView === 'function') {
                    topTarget.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                } else if (contentArea && typeof contentArea.scrollTo === 'function') {
                    contentArea.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                } else {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                }

                if (btn) {
                    btn.classList.remove('at-bottom');
                    btn.setAttribute('aria-label', '一键到底');
                    btn.setAttribute('title', '一键到底');
                }
                return;
            }

            const target = list ? list.lastElementChild : null;

            if (target && typeof target.scrollIntoView === 'function') {
                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'end'
                });
            } else {
                const candidates = [contentArea, libraryMain, document.scrollingElement, document.documentElement, document.body].filter(Boolean);
                let scrolled = false;
                for (const el of candidates) {
                    const canScroll = el.scrollHeight > el.clientHeight + 4;
                    if (canScroll && typeof el.scrollTo === 'function') {
                        el.scrollTo({
                            top: el.scrollHeight,
                            behavior: 'smooth'
                        });
                        scrolled = true;
                        break;
                    }
                }

                if (!scrolled) {
                    window.scrollTo({
                        top: document.documentElement.scrollHeight || document.body.scrollHeight,
                        behavior: 'smooth'
                    });
                }
            }

            if (btn) {
                btn.classList.add('at-bottom');
                btn.setAttribute('aria-label', '回到列表顶部');
                btn.setAttribute('title', '回到列表顶部');
            }
        }

        function updateMobileScrollBottomVisibility() {
            const btn = document.getElementById('mobileScrollBottomBtn');
            if (!btn) return;
            const shouldShow = libraryExpanded && !organizeMode && !document.querySelector('.setting-item.editing') && !document.querySelector('.modal.active');
            btn.classList.toggle('active', shouldShow);
        }

        // 页面加载时初始化
        (async function initializeApp() {
            await loadSettings();
            updateLibraryState();
            bindGlobalModalStateObserver();
            bindSyncInputEvents();
            bindFrontGateInputEvents();
            updateSyncUi();
            initializeFrontGate().catch(error => {
                setFrontGateStatus(getFriendlyFirebaseError(error), 'error');
            });
        })();
    </script>
</body>
</html>
